<!doctype html>
<!-- Source for /og-image.png (the link-preview image). Render at 1200x630:
     node tools/render-og.js   (needs Playwright and a local server on :8765) -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/site.min.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--paper); color: var(--ink); position: relative; }
  .top { position: absolute; left: 72px; right: 72px; top: 60px; display: flex; justify-content: space-between; align-items: center; }
  .wm { font: 400 40px/1 var(--serif); }
  .tag { font: 400 16px var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); display: flex; gap: 12px; align-items: center; }
  h1 { position: absolute; left: 68px; bottom: 175px; margin: 0; font: 400 168px/0.9 var(--serif); letter-spacing: -0.02em; }
  .pills { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; }
  .pills li { border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 10px 18px; font: 400 17px var(--mono); text-transform: uppercase; letter-spacing: 0.04em; }
  .band { position: absolute; right: 0; top: 0; bottom: 0; width: 14px; background: var(--kelp); }
</style></head>
<body>
  <div class="top"><div class="wm">Coastal Merino</div><div class="tag">First run in development</div></div>
  <h1>The merino polo.</h1>
  <ul class="pills"><li>100% merino</li><li>Finer than 18 micron</li><li>0% synthetic</li></ul>
  <div class="band"></div>
</body></html>
