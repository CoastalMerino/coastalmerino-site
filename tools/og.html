<!doctype html>
<!-- Source for /og-image.png (the link-preview image). Render at 1200x630:
     node tools/render-og.js   (needs Playwright) -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/site.min.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #121A2F; color: #fff; display: flex; align-items: center; justify-content: center; }
  .frame { position: absolute; inset: 28px; border: 1px solid rgba(255,255,255,0.22); }
  .wrap { position: relative; text-align: center; }
  .wm { font: 500 30px/1 var(--display); letter-spacing: 0.32em; text-transform: uppercase; padding-left: 0.32em; }
  .rule { width: 56px; height: 1px; background: rgba(255,255,255,0.5); margin: 44px auto; }
  h1 { font: 500 96px/1 var(--display); margin: 0; }
  h1 em { font-style: italic; }
  p { font: 400 30px/1.3 var(--text); margin: 26px 0 0; color: rgba(255,255,255,0.82); }
  .url { position: absolute; bottom: 58px; left: 0; right: 0; text-align: center; font: 500 15px/1 var(--label); letter-spacing: 0.3em; color: rgba(255,255,255,0.6); }
</style></head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <div class="wm">Coastal Merino</div>
    <div class="rule"></div>
    <h1>The merino polo.</h1>
    <p>100% superfine merino. Nothing synthetic.</p>
  </div>
  <div class="url">COASTALMERINO.COM</div>
</body></html>
