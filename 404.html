<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F0E8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg: #F4F0E8; --ink: #1F2A44; --muted: #6B6A64; --line: rgba(31, 42, 68, 0.18); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
  header, footer { padding: 28px 24px; text-align: center; }
  .wordmark { font-size: 15px; font-weight: 500; letter-spacing: 0.42em; text-transform: uppercase; padding-left: 0.42em; color: inherit; text-decoration: none; }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 32px 24px 48px; }
  h1 { font-size: 32px; font-weight: 400; margin-bottom: 8px; }
  h2 { font-size: 17px; font-weight: 500; margin: 32px 0 8px; }
  p, li { font-size: 16px; line-height: 1.7; color: var(--muted); }
  ul { padding-left: 20px; }
  a { color: var(--ink); }
  .date { font-size: 14px; margin-bottom: 24px; }
  footer { font-size: 13px; color: var(--muted); }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
</style>
<title>Page not found | Coastal Merino</title>
<meta name="robots" content="noindex">
</head>

</main>
<footer><a href="mailto:hello@coastalmerino.com">hello@coastalmerino.com</a></footer>
</body>
</html>
